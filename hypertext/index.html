<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(un)equal opportunity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section id="intro">
      <h1>(un)equal opportunity</h1>

      <button id="start-button" type="button">Begin</button>
    </section>

    <header id="top-section" hidden>
      <h1>(un)equal opportunity</h1>

      <div id="status-bar">
        <span>Resources:</span>
        <span id="resources">Unknown</span>
      </div>

      <div
        id="progress-container"
        role="progressbar"
        aria-label="Story progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progress"></div>
      </div>
    </header>

    <section id="story"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
